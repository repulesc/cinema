name: LSL compile check
on: [push, pull_request]
jobs:
  lslcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lite is paused (frozen at 4.4.5) until the full version leaves beta. To resume, bring back:
      #   python3 tools/build_lite.py --check   and   python3 tools/sim/lite_test.py
      - name: Compile-check the full (hud/src), the Watch HUD (watch) and frozen v3 (legacy/v3/src) scripts
        run: bash tools/lslcheck.sh
      - name: Install Pillow (the sprite-sheet test reads the real texture)
        run: python3 -m pip install --quiet pillow
      - name: Simulate the scenery spot finder, room views, people framing, reach learning and the tap decoder
        run: |
          python3 tools/sim/scenery_sim.py
          python3 tools/sim/people_geometry.py
          python3 tools/sim/indoor_sim.py
          python3 tools/sim/tap_test.py
          python3 tools/sim/friends_sim.py
          python3 tools/sim/sheet_test.py
          python3 tools/sim/reach_sim.py
          python3 tools/sim/framing_sim.py
          python3 tools/sim/frame_sim.py
          python3 tools/sim/seated_sim.py
          python3 tools/sim/lens_sim.py
          python3 tools/sim/sync_sim.py
          python3 tools/sim/menu_sim.py
          python3 tools/sim/tips_sim.py
          python3 tools/sim/listing_check.py
