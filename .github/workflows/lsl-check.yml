name: LSL compile check
on: [push, pull_request]
jobs:
  lslcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check all HUD scripts
        run: bash tools/lslcheck.sh
