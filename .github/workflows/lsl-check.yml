name: LSL compile check
on: [push, pull_request]
jobs:
  lslcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The free Take 12 Scenery (scenery/src) is generated from hud/src and up to date
        run: python3 tools/build_scenery.py --check
      - name: Compile-check every script (hud/src, hud/build, scenery/src, legacy/v3/src); fail under 15 KB free
        run: bash tools/lslcheck.sh
      - name: Install Pillow and the Inter font (the strip's textures and the boards)
        run: |
          python3 -m pip install --quiet pillow
          sudo apt-get install -y -qq fonts-inter
      - name: The textures' cell tables in screen.lsl match the art
        run: python3 tools/art/make_strip.py --check
      - name: Run the REAL scripts in the LSL emulator (tools/emu)
        run: |
          python3 tools/sim/layout_emu.py
          python3 tools/sim/gestures_emu.py
          python3 tools/sim/shots_emu.py
          python3 tools/sim/portrait_emu.py
          python3 tools/sim/tracking_emu.py
          python3 tools/sim/fixed_emu.py
          python3 tools/sim/scenic_emu.py
          python3 tools/sim/carry_emu.py
          python3 tools/sim/builder_emu.py
      - name: Runtime memory on the real scripts - no script runs out of memory at its heaviest (8.0.1)
        run: python3 tools/sim/memory_emu.py
      - name: Connect on the real scripts - scenarios, then a fuzzer on two and three HUDs (and lost messages)
        run: python3 tools/sim/connect_emu.py 20 1000
      - name: Every word, the free build, the listings
        run: |
          python3 tools/sim/text_check.py
          python3 tools/sim/free_test.py
          python3 tools/sim/listing_check.py
